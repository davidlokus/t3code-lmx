name: Fork Release

# Tag-driven automated release pipeline for T3 Lab (Extend) (`davidlokus/t3code-lmx`).
# Tags use `vX.Y.Z-lab.N` so they never collide with upstream tags.
# Gate chain: preflight (ancestry + green Fork CI + guard test)
#   -> build_mac_arm64 (full DMG + verify-mac-dmg.sh + smoke-desktop-app.ts + SHA256SUMS)
#   -> publish (out-of-order-safe Latest mark + GitHub Release).

on:
  push:
    tags:
      - "v*-lab.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing vX.Y.Z-lab.N tag to build (leave empty with dry_run=true to test HEAD on lmx-lab)"
        required: false
        type: string
      dry_run:
        description: "Build, verify, and smoke-test without publishing a GitHub Release"
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: fork-release-${{ github.ref_name || inputs.tag || github.sha }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Preflight
    if: github.repository == 'davidlokus/t3code-lmx'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      ref: ${{ steps.resolve.outputs.ref }}
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
      sha: ${{ steps.resolve.outputs.sha }}
      dry_run: ${{ steps.resolve.outputs.dry_run }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          sparse-checkout: |
            /*
            !/.repos/
            !/apps/mobile/modules/t3-terminal/Vendor/**/*.a
          sparse-checkout-cone-mode: false

      - name: Resolve and validate release ref
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin lmx-lab:refs/remotes/origin/lmx-lab
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            TAG="$GITHUB_REF_NAME"
            DRY_RUN="false"
            REF="refs/tags/$TAG"
          else
            DRY_RUN="${INPUT_DRY_RUN:-true}"
            if [[ -n "$INPUT_TAG" ]]; then
              TAG="$INPUT_TAG"
              REF="refs/tags/$TAG"
              git fetch origin "refs/tags/$TAG:refs/tags/$TAG"
            else
              if [[ "$DRY_RUN" != "true" ]]; then
                echo "::error::Non-dry-run dispatch requires an explicit vX.Y.Z-lab.N tag."
                exit 1
              fi
              PKG_VER=$(node -p "require('./apps/desktop/package.json').version")
              TAG="v${PKG_VER}-lab.0"
              REF="origin/lmx-lab"
            fi
          fi

          VERSION="${TAG#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-lab\.[0-9]+$ ]]; then
            echo "::error::Invalid fork release tag '$TAG' (expected vX.Y.Z-lab.N)."
            exit 1
          fi

          SHA=$(git rev-parse "${REF}^{commit}")
          if ! git merge-base --is-ancestor "$SHA" origin/lmx-lab; then
            echo "::error::Commit $SHA ($TAG) is not an ancestor of origin/lmx-lab."
            exit 1
          fi

          if [[ "$DRY_RUN" != "true" ]]; then
            GREEN_SHAS=$(gh run list -R "$GITHUB_REPOSITORY" --workflow "Fork CI" --branch lmx-lab --limit 30 --json headSha,status,conclusion -q '.[] | select(.status == "completed" and .conclusion == "success") | .headSha')
            FOUND=""
            for candidate in $GREEN_SHAS; do
              if [[ "$candidate" == "$SHA" ]] || git merge-base --is-ancestor "$SHA" "$candidate" 2>/dev/null; then
                FOUND="$candidate"
                break
              fi
            done
            if [[ -z "$FOUND" ]]; then
              echo "::error::No completed green Fork CI run on lmx-lab covers $SHA."
              exit 1
            fi
            echo "Verified green Fork CI covering $SHA (at $FOUND)."
          fi

          echo "ref=$SHA" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "dry_run=$DRY_RUN" >> "$GITHUB_OUTPUT"

      - name: Setup Vite+
        uses: ./.github/actions/setup-ci-deps
        with:
          save-pnpm-store: false

      - name: Run Fork invariant guard
        run: vp test run packages/shared/src/forkIdentity.guard.test.ts

  build_mac_arm64:
    name: Build & smoke macOS arm64
    needs: preflight
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Checkout release commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.preflight.outputs.sha }}
          fetch-depth: 1
          sparse-checkout: |
            /*
            !/.repos/
            !/apps/mobile/modules/t3-terminal/Vendor/**/*.a
          sparse-checkout-cone-mode: false

      - name: Setup dependencies
        uses: ./.github/actions/setup-ci-deps
        with:
          install-args: --filter=@t3tools/desktop... --filter=t3... --filter=@t3tools/web... --filter=@t3tools/scripts...

      - name: Cache resource monitor
        id: resource_monitor_cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: native/resource-monitor/target/aarch64-apple-darwin/release/t3-resource-monitor
          key: fork-resource-monitor-aarch64-apple-darwin-${{ hashFiles('.cargo/config.toml', 'native/resource-monitor/Cargo.lock', 'native/resource-monitor/Cargo.toml', 'native/resource-monitor/src/**') }}

      - name: Setup Rust
        if: steps.resource_monitor_cache.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: aarch64-apple-darwin

      - name: Build resource monitor
        if: steps.resource_monitor_cache.outputs.cache-hit != 'true'
        run: cargo build --locked --release --manifest-path native/resource-monitor/Cargo.toml --target aarch64-apple-darwin

      - name: Build unsigned arm64 DMG
        env:
          # Clear repository hints so unsigned fork builds never emit an app-update.yml.
          GITHUB_REPOSITORY: ""
          T3CODE_DESKTOP_UPDATE_REPOSITORY: ""
          T3CODE_DESKTOP_REUSE_RESOURCE_MONITOR: "true"
        run: >-
          vp run dist:desktop:artifact
          --platform mac
          --target dmg
          --arch arm64
          --build-version "${{ needs.preflight.outputs.version }}"
          --verbose

      - name: Verify DMG branding, isolation, and boot
        run: >-
          bash fork/scripts/verify-mac-dmg.sh
          "release/T3-Lab-Extend-${{ needs.preflight.outputs.version }}-arm64.dmg"
          "${{ needs.preflight.outputs.version }}"

      - name: Run Playwright desktop launch smoke test
        run: |
          set -euo pipefail
          MNT=$(mktemp -d "${RUNNER_TEMP%/}/t3lab-smoke-mnt-XXXXXX")
          MOUNTED=0
          cleanup() {
            if [ "$MOUNTED" -eq 1 ]; then
              hdiutil detach "$MNT" -quiet || hdiutil detach "$MNT" -force -quiet || true
              MOUNTED=0
            fi
            rmdir "$MNT" 2>/dev/null || true
          }
          trap cleanup EXIT
          hdiutil attach "release/T3-Lab-Extend-${{ needs.preflight.outputs.version }}-arm64.dmg" -nobrowse -readonly -mountpoint "$MNT" -quiet
          MOUNTED=1
          node scripts/smoke-desktop-app.ts \
            --executable "$MNT/T3 Lab (Extend).app/Contents/MacOS/T3 Lab (Extend)" \
            --artifacts-dir "${RUNNER_TEMP%/}/smoke-artifacts"

      - name: Upload smoke artifacts on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fork-release-smoke-failure-mac-arm64
          path: ${{ runner.temp }}/smoke-artifacts
          if-no-files-found: ignore

      - name: Stage release assets and checksums
        run: |
          set -euo pipefail
          VER="${{ needs.preflight.outputs.version }}"
          mkdir -p dist-release
          cp "release/T3-Lab-Extend-${VER}-arm64.dmg" dist-release/
          cp "release/T3-Lab-Extend-${VER}-arm64.zip" dist-release/
          (cd dist-release && shasum -a 256 "T3-Lab-Extend-${VER}-arm64.dmg" "T3-Lab-Extend-${VER}-arm64.zip" > SHA256SUMS)
          cat dist-release/SHA256SUMS

      - name: Upload release artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fork-release-mac-arm64
          path: dist-release/
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub Release
    needs: [preflight, build_mac_arm64]
    if: needs.preflight.outputs.dry_run != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout git history for release notes
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          sparse-checkout: |
            /FORK.md
          sparse-checkout-cone-mode: false

      - name: Download release artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: fork-release-mac-arm64
          path: dist-release

      - name: Verify expected assets and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.preflight.outputs.tag }}
          VER: ${{ needs.preflight.outputs.version }}
          SHA: ${{ needs.preflight.outputs.sha }}
        run: |
          set -euo pipefail
          for f in "T3-Lab-Extend-${VER}-arm64.dmg" "T3-Lab-Extend-${VER}-arm64.zip" "SHA256SUMS"; do
            test -s "dist-release/$f" || { echo "::error::Missing expected release asset: $f"; exit 1; }
          done

          PREV_TAG=$(git tag --list 'v*-lab.*' --sort=-v:refname | grep -Fxv "$TAG" | head -n 1 || true)
          {
            echo "## T3 Lab (Extend) ${TAG}"
            echo ""
            echo "- Commit: \`${SHA}\` (\`lmx-lab\`)"
            echo "- Verified: \`Fork CI\` green, \`forkIdentity.guard.test.ts\` pass, \`verify-mac-dmg.sh\` pass, Playwright \`smoke-desktop-app.ts\` pass."
            echo "- Unsigned ad-hoc Apple Silicon build; after copying to \`/Applications\`, run \`xattr -dr com.apple.quarantine \"/Applications/T3 Lab (Extend).app\"\` if Gatekeeper prompts."
            echo ""
            echo "### Changes"
            if [[ -n "$PREV_TAG" ]]; then
              git log --no-merges --pretty='- %s (%h)' "${PREV_TAG}..${SHA}"
            else
              git log --no-merges -n 20 --pretty='- %s (%h)' "${SHA}"
            fi
          } > release-notes.md

          newest_lab_tag() {
            gh release list -R "$GITHUB_REPOSITORY" -L 100 --exclude-drafts --json tagName -q '.[].tagName' |
              { grep -E '^v[0-9]+\.[0-9]+\.[0-9]+-lab\.[0-9]+$' || true; } | sort -V | tail -n 1
          }

          TOP=$(newest_lab_tag)
          if [[ -z "$TOP" ]] || [[ "$(printf '%s\n%s\n' "$TOP" "$TAG" | sort -V | tail -n 1)" == "$TAG" ]]; then
            IS_LATEST=true
          else
            IS_LATEST=false
          fi

          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$TAG" -R "$GITHUB_REPOSITORY" --notes-file release-notes.md --latest="$IS_LATEST"
            gh release upload "$TAG" dist-release/* -R "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" dist-release/* -R "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "T3 Lab (Extend) ${TAG}" \
              --notes-file release-notes.md \
              --latest="$IS_LATEST"
          fi

          # Guard against concurrent out-of-order publishes stealing Latest.
          TOP=$(newest_lab_tag)
          CURRENT_LATEST=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" -q .tag_name 2>/dev/null || true)
          if [[ -n "$TOP" ]] && [[ "$CURRENT_LATEST" != "$TOP" ]]; then
            gh release edit "$TOP" -R "$GITHUB_REPOSITORY" --latest >/dev/null
          fi
